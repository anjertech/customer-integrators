# Names must match the EKS Pod Identity associations created in the infra
# (etl/orchestrator → S3 read; etl/worker → Secrets Manager + S3). No IRSA
# annotations — Pod Identity binds by namespace + SA name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.orchestrator }}
  namespace: {{ .Values.namespace.name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.worker }}
  namespace: {{ .Values.namespace.name }}

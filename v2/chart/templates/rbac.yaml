# The orchestrator creates/cleans up worker Jobs, so it needs Job permissions in
# this namespace. The worker SA needs no RBAC — it never calls the k8s API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator
  namespace: {{ .Values.namespace.name }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator
  namespace: {{ .Values.namespace.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orchestrator
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.orchestrator }}
    namespace: {{ .Values.namespace.name }}

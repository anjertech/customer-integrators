{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    # The vpn-sidecar runs privileged (openfortivpn needs /dev/ppp + NET_ADMIN),
    # so this namespace must permit privileged pods.
    pod-security.kubernetes.io/enforce: privileged
{{- end }}
